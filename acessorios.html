
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxCell - Acessórios</title>
    <link rel="stylesheet" href="acessorios.css">
</head>
<body>

    <main class="container">

       <div class="container">

         <header class="topo">
            <img src="img/im1 1.png" alt="Logo LuxCell">
        </header>


        <h2 class="titulo">ACESSÓRIOS</h2>

        <section class="produtos">

            <article class="produto">
                <img src="img/fone sem fio.jpg" alt="Fones sem fio">
                <h3>Fones sem fio</h3>
                <p class="preco">R$ 30,00</p>
            </article>

            <article class="produto">
                <img src="img/suportecll.webp" alt="Suporte para celular">
                <h3>Suporte para celular</h3>
                <p class="preco">R$ 20,00</p>
            </article>

            <article class="produto">
                <img src="img/tripe.jpg" alt="Tripé para celular">
                <h3>Tripé para celular</h3>
                <p class="preco">R$ 20,00</p>
            </article>

            <article class="produto">
                <img src="img/chaveiro.jpg" alt="Chaveiro">
                <h3>Chaveiro</h3>
                <p class="preco">R$ 10,00</p>
            </article>

            <article class="produto">
                <img src="img/carregador.webp" alt="Carregador portátil">
                <h3>Carregador portátil</h3>
                <p class="preco">R$ 89,90</p>
            </article>

            <article class="produto">
                <img src="img/acessorio para celukar.webp" alt="Acessório para celular">
                <h3>Acessório para celular</h3>
                <p class="preco">R$ 20,00</p>
            </article>

        </section>

    </main>

</body>
</html>
