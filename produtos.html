
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxCell - Loja de Celulares</title>
    <link rel="stylesheet" href="produtos.css">
</head>

<body>

    <div class="container">

         <header class="topo">
            <img src="img/im1 1.png" alt="Logo LuxCell">
        </header>


        <h2 class="titulo-secao">Celulares</h2>

        <section class="produtos">

            <article class="produto">
                <div class="foto">
                    <img src="img/moto g86.jpg" alt="Celular Moto G84">
                </div>
                <div class="info">
                    <h3>Moto G84</h3>
                    <p class="preco">R$ 1.899,00</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="img/galaxie a54.webp" alt="Celular Galaxy A54">
                </div>
                <div class="info">
                    <h3>Galaxy A54</h3>
                    <p class="preco">R$ 1.799,00</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="img/iphone 14.jpg" alt="iPhone 14">
                </div>
                <div class="info">
                    <h3>iPhone 14</h3>
                    <p class="preco">R$ 3.249,00</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="img/15 pro.avif" alt="iPhone 15 Pro">
                </div>
                <div class="info">
                    <h3>iPhone 15 Pro</h3>
                    <p class="preco">R$ 6.499,00</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="img/s23 ultra.jpg" alt="Galaxy S23 Ultra">
                </div>
                <div class="info">
                    <h3>Galaxy S23 Ultra</h3>
                    <p class="preco">R$ 5.499,00</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="img/note 13.webp" alt="Redmi Note 13">
                </div>
                <div class="info">
                    <h3>Redmi Note 13</h3>
                    <p class="preco">R$ 2.199,00</p>
                </div>
            </article>

        </section>


        <h2 class="titulo-secao">Capinhas</h2>

        <section class="produtos">

            <article class="produto">
                <div class="foto">
                    <img src="img/capinha.transp..jpg" alt="Capinha transparente">
                </div>
                <div class="info">
                    <h3>Capinha Transparente iPhone 11</h3>
                    <p class="preco">R$ 29,90</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="img/silicone.7.webp" alt="Capinha de silicone iphone 7">
                </div>
                <div class="info">
                    <h3>Capinha Silicone iPhone 7</h3>
                    <p class="preco">R$ 39,90</p>
                </div>
            </article>

            <article class="produto">
                <div class="foto">
                    <img src="IMG/a25.jpg" alt="Capinha antichoque">
                </div>
                <div class="info">
                    <h3>Capinha Antichoque A25</h3>
                    <p class="preco">R$ 59,90</p>
                </div>
            </article>

        </section>

    </div>

</body>
</html>
