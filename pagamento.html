
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxCell - Finalizar Pedido</title>
    <link rel="stylesheet" href="pagamento.css">
</head>
<body>

    <main class="container">

          <header class="topo">
            <div class="logo">
                 <img src="img/im1 1.png" alt="Capinhas para celular">
            </div>
        </header>

        <h2 class="titulo">FINALIZAR PEDIDO</h2>

        <section class="carrinho">
            <h3>SEU CARRINHO</h3>
            <p class="produto">Seu produto</p>
        </section>

        <div class="total">
            TOTAL: 
        </div>

        <section class="pagamento">
            <h3 class="titulo-pagamento">FORMA DE PAGAMENTO</h3>

            <label class="opcao">
                <input type="radio" name="pagamento" value="credito">
                <span>CARTÃO DE CRÉDITO</span>
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="debito">
                <span>CARTÃO DE DÉBITO</span>
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="pix">
                <span>PIX</span>
            </label>
        </section>

        <div class="finalizar">
            <button type="button">CONTINUAR PAGAMENTO</button>
        </div>

    </main>

</body>
</html>
