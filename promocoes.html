
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxCell - Promoções</title>
    <link rel="stylesheet" href="promocoes.css">
</head>
<body>

    <main class="container">

        <header class="topo">
            <div class="logo">
                 <img src="img/im1 1.png" alt="Capinhas para celular">
            </div>
        </header>


        
        <h2 class="titulo">PROMOÇÕES</h2>

        <section class="produtos">

            <article class="produto">
                <img src="img/comboi.jpg" alt="Capinhas para celular">
                <h3>1 capinha siliconada e 1 pelicula 3D</h3>
                <p class="descricao">COMBO: Capinha + Pelicula 3D</p>
                <p class="preco">R$ 29,90</p>
            </article>

            <article class="produto">
                <img src="img/combo2.webp" alt="Carregador e cabo">
                <h3>Carregador Combo</h3>
                <p class="descricao">Carregador + cabo</p>
                <p class="preco">R$ 39,90</p>
            </article>

        </section>

    </main>

</body>
</html>
